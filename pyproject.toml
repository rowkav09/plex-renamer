[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "plex-renamer"
version = "1.0.0"
description = "Professional tool for organizing TV shows in Plex-perfect format"
readme = "README.md"
requires-python = ">=3.7"
license = {text = "MIT"}
authors = [
    {name = "Plex Renamer Contributors"}
]
keywords = ["plex", "tv-shows", "media", "renamer", "organization"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Video",
    "Topic :: System :: Filesystems",
]

dependencies = [
    "requests>=2.25.0",
    "rich>=10.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=6.0",
    "black>=21.0",
    "flake8>=3.9",
    "mypy>=0.900",
]

[project.urls]
Homepage = "https://github.com/yourname/plex-renamer"
Documentation = "https://github.com/yourname/plex-renamer#readme"
Repository = "https://github.com/yourname/plex-renamer.git"
Issues = "https://github.com/yourname/plex-renamer/issues"
Changelog = "https://github.com/yourname/plex-renamer/releases"

[project.scripts]
plex-renamer = "plex_renamer:main"

[tool.setuptools]
packages = ["plex_renamer"]

[tool.black]
line-length = 100
target-version = ['py37']

[tool.mypy]
python_version = "3.7"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
